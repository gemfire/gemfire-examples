plugins {
    id "org.nosphere.apache.rat" version "0.7.1"
    id "com.diffplug.spotless" version "8.3.0"
    id "de.undercouch.download" version "4.0.4"
}

if (project.getProperty('gemfireRepositoryUrl').contains('broadcom.com')) {
    if (!project.hasProperty("gemfireReleaseRepoUser") || gemfireReleaseRepoUser.isEmpty()) {
        throw new GradleException("Please set gemfireReleaseRepoUser in gradle.properties to the email address you registered at https://support.broadcom.com/")
    }
    if (!project.hasProperty("gemfireReleaseRepoPassword") || gemfireReleaseRepoPassword.isEmpty()) {
        throw new GradleException("Please set gemfireReleaseRepoPassword in gradle.properties to the registry token for $gemfireReleaseRepoUser found by navigating to https://support.broadcom.com > My Downloads > Registry Tokens")
    }
}

allprojects {
    repositories {
        if (!gradle.usingGeodeCompositeBuild) {
          maven {
            if (project.getProperty('gemfireRepositoryUrl').contains('broadcom.com')) {
              credentials {
                username = "$gemfireReleaseRepoUser"
                password = "$gemfireReleaseRepoPassword"
              }
            }
            url = project.getProperty('gemfireRepositoryUrl')
            content {
              includeGroup 'com.vmware.gemfire'
              includeGroup 'org.springframework'
            }
          }
        }
        if(project.hasProperty("useMavenLocal")) {
            mavenLocal()
        }
        mavenCentral()
    }
}

def installDir = System.getenv('GEMFIRE_HOME') ?: System.getenv('GEODE_HOME') ?: System.getProperty('GEMFIRE_HOME')

def checkEnvTask = tasks.register('checkEnv') {
    doLast {
        if (installDir==null || installDir.isEmpty()) {
            throw new GradleException("Please export GEMFIRE_HOME=<the top-level directory extracted from your GemFire .tgz> (if this message persists, you may also need to ./gradlew --stop)")
        } else {
            println("GemFire directory is $installDir")
        }
    }
}

configurations {
    compositeTarget
    gemfireDistribution
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(project.compileJVMVer)
        }
    }

    dependencies {
        // All callouts to com.vmware.gemfire here, need to be specified in settings.gradle
        // for composite build to work
        api(platform("com.vmware.gemfire:gemfire-all-bom:$gemfireVersion"))
        implementation("com.vmware.gemfire:gemfire-core")
        implementation("com.vmware.gemfire:gemfire-cq")
        implementation("com.vmware.gemfire:gemfire-logging")
        // gemfire-all-bom only pins first-party module versions now, so third-party
        // versions must be pinned explicitly here (see GEM-17763)
        implementation('com.google.guava:guava:33.7.1-jre')
        implementation('org.apache.commons:commons-lang3:3.20.0')
        implementation("org.apache.logging.log4j:log4j-core:2.26.1")

        testImplementation("org.awaitility:awaitility:4.3.0")
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.23.0")
        testImplementation("com.github.stefanbirkner:system-rules:1.19.0")
        testImplementation("org.assertj:assertj-core:3.27.7")
        testImplementation('org.apache.httpcomponents:httpcore:4.4.16')
        testImplementation('org.apache.httpcomponents:httpclient:4.5.14')
        runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1"
    }

    project.version = null
    jar {
    }

    tasks.register('cleanServer') {
        doLast {
            delete 'locator'
            delete 'locator-ln'
            delete 'locator-ln1'
            delete 'locator-ln2'
            delete 'locator-ny'
            delete 'server1'
            delete 'server2'
            delete 'server-ln-1'
            delete 'server-ln-2'
            delete 'server-ny-1'
            delete 'server-ny-2'
        }
    }
    tasks.named('clean').configure {
      finalizedBy tasks.named('cleanServer')
    }

    tasks.register('start', Exec) {
        ['build', 'cleanServer'].each {
          dependsOn tasks.named(it)
        }
        dependsOn checkEnvTask
        workingDir projectDir
        environment 'GEODE_HOME', installDir
        // If start.gfsh fails part-way (e.g. a command fails after the locator/servers are up), Gradle aborts
        // before the 'stop' task can run, leaving members behind that hold ports (such as 10334) and break
        // any later example or demo on the same host (GEM-24378).  Best-effort stop the cluster, then fail.
        commandLine 'sh', '-c',
                "$installDir/bin/gfsh run --file=${projectDir}/scripts/start.gfsh || { rc=\$? ; " +
                "echo \"start.gfsh failed (exit \$rc); stopping any members it started...\" ; " +
                "$installDir/bin/gfsh run --file=${projectDir}/scripts/stop.gfsh || true ; " +
                "exit \$rc ; }"
    }

    tasks.register('stop', Exec) {
        dependsOn checkEnvTask
        workingDir projectDir
        environment 'GEODE_HOME', installDir
        commandLine 'sh', '-c', "$installDir/bin/gfsh run --file=${projectDir}/scripts/stop.gfsh"
    }

    tasks.register('run', JavaExec) {
        dependsOn tasks.named('build')
        description = 'Run example'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = "com.vmware.gemfire.examples.${project.name}.Example"
    }

    tasks.register('waitForExitingMembers', Exec) {
        workingDir projectDir
        environment 'GEODE_HOME', installDir
        ignoreExitValue = true
        commandLine 'sh', '-c', "" +
                "TIMEOUT=120 ;" +
                "echo \"Waiting at most \$TIMEOUT seconds for all members to shut down...\" ;" +
                "while pgrep -f \"(Server|Locator)Launcher\" > /dev/null ; do" +
                "  printf \".\" ; " +
                "  sleep 1 ;" +
                "  TIMEOUT=\$((\$TIMEOUT - 1)) ;" +
                "  if [ \$TIMEOUT -eq 0 ] ; then" +
                "    echo \"\" ;" +
                "    exit 10 ;" +
                "  fi ;" +
                "done ;" +
                "echo \"\""
        doLast {
            // We use exit code 10 to avoid conflict with pgrep exit codes.
            if (executionResult.orNull.exitValue == 10) {
                throw new GradleException("A member process persisted beyond permitted timeout.  Aborting.")
            } else if (executionResult.orNull.exitValue != 0) {
                throw new GradleException("waitForExistingMembers failed with exit code: " + executionResult.orNull.exitValue)
            }
        }
    }

    tasks.register('verifyNoMembersRunning', Exec) {
        workingDir projectDir
        environment 'GEODE_HOME', installDir
        ignoreExitValue = true
        commandLine 'sh', '-c', "echo \"Looking for existing member processes...\" ; " +
                "pgrep -f \"(Server|Locator)Launcher\" ; "
        doLast {
            if (executionResult.orNull.exitValue == 0) {
                throw new GradleException("Existing members detected.  Examples expect a clean environment in which to run.")
            }
        }
    }
    if (gradle.usingGeodeCompositeBuild) {
        tasks.withType(JavaCompile) {
            options.fork = true
            options.forkOptions.jvmArgs += ['-Xmx3g']
        }
    }

    // Opt-in (-PkillLeftoverMembers=true, used by CI): terminate GemFire members left behind by an earlier
    // example or a failed run and wait for the locator port to be free, instead of failing on them (GEM-24378).
    tasks.register('killLeftoverMembers') {
        onlyIf { project.hasProperty('killLeftoverMembers') }
        doLast {
            def sh = { String cmd ->
                new ProcessBuilder('sh', '-c', cmd).inheritIO().start().waitFor()
            }
            def membersRunning = { sh('pgrep -f "(Server|Locator)Launcher" > /dev/null') == 0 }
            if (membersRunning()) {
                println "Terminating leftover GemFire members..."
                sh('pkill -f "(Server|Locator)Launcher"')
                for (int i = 0; i < 20 && membersRunning(); i++) {
                    sleep(1000)
                }
                if (membersRunning()) {
                    sh('pkill -9 -f "(Server|Locator)Launcher"')
                    sleep(1000)
                }
            }
            def portFree = {
                try {
                    def socket = new ServerSocket()
                    socket.setReuseAddress(true)
                    socket.bind(new InetSocketAddress(10334))
                    socket.close()
                    return true
                } catch (IOException ignored) {
                    return false
                }
            }
            for (int i = 0; i < 30 && !portFree(); i++) {
                sleep(1000)
            }
            if (!portFree()) {
                throw new GradleException("Port 10334 is still in use after terminating leftover members")
            }
        }
    }

    tasks.register('runAll') {
      ['killLeftoverMembers', 'verifyNoMembersRunning', 'start', 'run', 'stop', 'waitForExitingMembers'].each {
        dependsOn tasks.named(it)
      }
    }
    tasks.named('verifyNoMembersRunning').configure {mustRunAfter tasks.named('killLeftoverMembers')}
    tasks.named('start').configure {mustRunAfter tasks.named('verifyNoMembersRunning')}
    tasks.named('run').configure {mustRunAfter tasks.named('start')}
    tasks.named('stop').configure {mustRunAfter tasks.named('run')}
    tasks.named('waitForExitingMembers').configure {mustRunAfter tasks.named('stop')}

    // When running runAll, always stop the cluster once 'run' has been attempted, even if it fails;
    // otherwise Gradle aborts and the members keep holding their ports for whatever runs next (GEM-24378).
    // (Not applied to a standalone 'run', which is meant to leave the cluster up.)
    if (gradle.startParameter.taskNames.any { it == 'runAll' || it.endsWith(':runAll') }) {
        tasks.named('run').configure {finalizedBy tasks.named('stop')}
    }
}

apply from: "gradle/spotless.gradle"
apply from: "gradle/ide.gradle"
apply from: "gradle/rat.gradle"
