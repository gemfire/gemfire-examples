rootProject.name = 'interop'

// The GemFire API side of the interop: a client application, and a listener deployed to the
// server. Both are ordinary GemFire code that never mentions gRPC.
include 'gemfire-client'
include 'gemfire-server'

// The gRPC side. Not a Java project; its build shells out to buf and go build.
include 'go-client'
