# JAVA_HOME for compilation, separate from the Gradle JDK itself.
compileJVMVer=17

org.gradle.jvmargs=-Xmx3g

# This example resolves nothing from a Maven repository. GemFire comes from $GEMFIRE_HOME and the
# Protobuf jars come from the gRPC extension .gfm installed there, matching the other examples
# under clients/grpc-client. No repository credentials are needed.
