syntax = "proto3";

package test.v1;

option java_package = "com.example.test.v1";
option java_multiple_files = true;
option java_outer_classname = "PersonProto";
option go_package = "com.example/test/v1;test";

// Person message for testing
message Person {
    string first_name = 1;
    string last_name = 2;
}

